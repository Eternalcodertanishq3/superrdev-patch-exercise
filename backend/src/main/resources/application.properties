spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Fix (Bug #24 - Security): Disabled SQL logging in production to avoid leaking sensitive query params and wasting disk I/O
spring.jpa.show-sql=false

spring.sql.init.mode=always

# Fix (Bug #20 - Security): Disabled H2 console by default to eliminate remote code execution risk (RCE)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Fix (Bug #46 - Concurrency & Performance): Configured HikariCP connection pool parameters
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Fix (Bug #42 - Performance): Enabled gzip compression on HTTP response payloads to reduce network bandwidth
server.compression.enabled=true
server.compression.min-response-size=1024
server.port=8080

# Fix (Bug #27 - Security): Disallow stack traces in error responses to prevent information disclosure
server.error.include-stacktrace=never

# Fix (Bug #58 - DevOps & Stability): Graceful shutdown handling to allow in-flight HTTP requests to drain
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Fix (Bug #21 - Security): Configurable allowed origins for Cross-Origin Resource Sharing (CORS)
app.cors.allowed-origins=http://localhost:5173
