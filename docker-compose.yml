# Fix (Bug #52 - Production-Readiness): Docker Compose configuration for local dev and testing
version: '3.8'

services:
  task-tracker-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-tracker-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/tasks/statuses || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
